[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinted-monitoring"
version = "0.1.0"
description = "Single-tenant Vinted watches with SQLite, Telegram and MCP"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.7,<3",
    "pydantic>=2.11,<3",
    "starlette>=0.40,<2",
    "mcp>=1.26,<2",
    "uvicorn>=0.34,<1",
    "vinted-api-kit==1.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
vinted-monitoring = "vinted_monitoring.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_monitoring"]
