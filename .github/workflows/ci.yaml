name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: |
          uv export --frozen --no-dev --no-emit-project --no-editable --no-header --output-file /tmp/requirements.txt >/dev/null
          diff requirements.txt /tmp/requirements.txt
      - run: docker build -t vinted-monitoring:test .
      - run: python3 scripts/container_check.py
