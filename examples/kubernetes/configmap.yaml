apiVersion: v1
kind: ConfigMap
metadata:
  name: vinted-monitoring
  namespace: vinted-monitoring
data:
  VM_TRANSPORT: http
  VM_HOST: 0.0.0.0
  VM_PORT: "8000"
  VM_DATABASE: /data/monitor.sqlite3
  VM_ALLOWED_HOSTS: '["127.0.0.1:*","vinted-monitoring:8000","vinted-monitoring.vinted-monitoring.svc:8000"]'
